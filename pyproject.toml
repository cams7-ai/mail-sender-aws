[project]
name = "mail-sender-aws"
version = "0.1.0"
description = "API serverless para envio de e-mails via Amazon SES"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
