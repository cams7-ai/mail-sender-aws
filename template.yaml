AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Mail Sender Lambda - invoked privately by LotoBot with least-privilege IAM

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@2
  com.aws.cloudformation.Context:
    arch: LotoBot EC2 -> private Lambda Invoke -> Amazon SES
    must:
      - grant lambda:InvokeFunction only to approved consumer roles
    ref:
      - at: docs/AWS_SAM_MIGRATION_STEP_BY_STEP.md
        has: deploy and LotoBot integration procedure
        scope: local

Parameters:
  SesFrom:
    Type: String
    NoEcho: true
    Description: Email address verified in Amazon SES and used as the sender

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 128
    Architectures:
      - x86_64
    Environment:
      Variables:
        SES_FROM: !Ref SesFrom

Resources:
  MailSenderFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: accepts IAM-authorized direct invocations and sends one email through SES
        must:
          - do not add a public HTTP event for the LotoBot integration
    Properties:
      CodeUri: src/
      Handler: lambda_handler.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: "*"

  MailSenderFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MailSenderFunction}"
      RetentionInDays: 7

Outputs:
  FunctionArn:
    Description: Lambda ARN consumed by the LotoBot role.
    Value: !GetAtt MailSenderFunction.Arn
  FunctionName:
    Description: Lambda name for direct invocation.
    Value: !Ref MailSenderFunction
