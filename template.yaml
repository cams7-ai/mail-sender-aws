AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: mail-sender serverless API

Parameters:
  SesFrom:
    Type: String
    NoEcho: true
    Description: Email address verified in Amazon SES and used as the sender

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 128
    Architectures:
      - x86_64
    Environment:
      Variables:
        SES_FROM: !Ref SesFrom

Resources:
  MailSenderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: lambda_handler.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: "*"
      Events:
        SendMail:
          Type: HttpApi
          Properties:
            Path: /api/v1/mail/send
            Method: POST

  MailSenderFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MailSenderFunction}"
      RetentionInDays: 7

Outputs:
  ApiUrl:
    Description: HTTP API endpoint
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
